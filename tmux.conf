# TODO: install session plugin
# -------------------------------------

TMUX_PLUGIN_MANAGER_PATH="~/.local/share/tmux/plugins"
TMUX_HOME="~/.config/tmux"
MYTMUXRC="$TMUX_HOME/tmux.conf"

set -g default-terminal "$TERM"
set -as terminal-overrides \
    ',$TERM:\
     Ss=\\E[%p1%d q:\
     Se=\\E[2 q'

set-option -g default-command "${SHELL} -i"

set-option -g status-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 4096
set -g status off
set -g status-interval 2
set -g pane-border-status off
set -g clock-mode-colour blue
setw -g clock-mode-colour colour135
set -g status-position top
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g bell-action none
set-window-option -g monitor-activity off
set-window-option -g mode-keys vi
set -gq allow-passthrough on
set -g detach-on-destroy previous
set -g mouse on
set -g extended-keys on
set -sa terminal-features 'xterm*:extkeys'

force_color_prompt=yes

# --- Copy-mode ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Escape send-keys -X clear-selection
bind -T copy-mode Escape send -X cancel
bind -T copy-mode-vi Escape send -X cancel

# `y` as vim-style operator: if a selection is active (visual mode), copy it;
# otherwise switch into an operator-pending chord table that handles text
# objects. tmux has no native operator-pending mode — this chord layer fakes
# it. Press Escape at any point to back out without copying.
bind -T copy-mode-vi y if-shell -F '#{selection_present}' \
    'send-keys -X copy-pipe' \
    'switch-client -T copy_vi_y'

# yy = yank current line (matches vim)
bind -T copy_vi_y y send-keys -X select-line \; send-keys -X copy-pipe

# y{i,a}{motion}: inner / around text objects
bind -T copy_vi_y i switch-client -T copy_vi_yi
bind -T copy_vi_yi w send-keys -X select-word \; send-keys -X copy-pipe

# v{i,a}{motion}: visual-select text objects (viw selects inner word)
bind -T copy-mode-vi i switch-client -T copy_vi_i
bind -T copy_vi_i w send-keys -X select-word

# --- Unbinds (remove tmux defaults) ---
unbind :
unbind Escape
unbind C-h
unbind C-j
unbind C-k
unbind C-l
unbind d

# --- Single-key (prefix + X) ---
bind Tab last-window
bind "'" run "$TMUX_PLUGIN_MANAGER_PATH/tmux-floax/scripts/floax.sh"
bind C-u  copy-mode

bind -T prefix : command-prompt
bind -T prefix ` command-prompt -p "Move buffer to:"  "select-pane -t '%%'"
bind -T prefix ? run "tmux new-window; tmux list-keys"

# Pane select 0-9
bind -T prefix 0 select-pane -t 0
bind -T prefix 1 select-pane -t 1
bind -T prefix 2 select-pane -t 2
bind -T prefix 3 select-pane -t 3
bind -T prefix 4 select-pane -t 4
bind -T prefix 5 select-pane -t 5
bind -T prefix 6 select-pane -t 6
bind -T prefix 7 select-pane -t 7
bind -T prefix 8 select-pane -t 8
bind -T prefix 9 select-pane -t 9

# --- Chord-table entry points ---
bind -T prefix b   switch-client -T prefix_b
bind -T prefix e   switch-client -T prefix_e
bind -T prefix f   switch-client -T prefix_f
bind -T prefix F   switch-client -T prefix_F
bind -T prefix G   switch-client -T prefix_G
bind -T prefix h   switch-client -T prefix_h
bind -T prefix j   switch-client -T prefix_j
bind -T prefix l   switch-client -T prefix_l
bind -T prefix N   switch-client -T prefix_N
bind -T prefix q   switch-client -T prefix_q
bind -T prefix w   switch-client -T prefix_w
bind -T prefix C-x switch-client -T prefix_CX

# --- prefix b : buffer / window ---
bind -T prefix_b b set -g status on \; choose-tree -Zw
bind -T prefix_b e clear-history
bind -T prefix_b p previous-window
bind -T prefix_b n next-window
bind -T prefix_b d kill-window
bind -T prefix_b N switch-client -T prefix_bN

bind -T prefix_bN n new-window -c "#{pane_current_path}"
bind -T prefix_bN f run "ghostty -e tmux new-session"

# --- prefix h : help ---
bind -T prefix_h k list-keys

# --- prefix f : find ---
bind -T prefix_f e switch-client -T prefix_e
bind -T prefix_f R command-prompt -p "Rename windows:"  "rename-window '%%'"

# --- prefix F : heavy ---
bind -T prefix_F b list-panes -a \; command-prompt -p "join-pane from (format: session:window.pane):" "join-pane -s '%%'"
bind -T prefix_F B break-pane
bind -T prefix_F n run "ghostty -e tmux new-session -A"

# --- prefix e : edit/reload config ---
bind -T prefix_e d new-window "nvim $MYTMUXRC"
bind -T prefix_e R run "tmux source-file $MYTMUXRC; tmux display-message 'Reloaded config'"
bind -T prefix_e U run "$TMUX_PLUGIN_MANAGER_PATH/bin/install_plugins"

# --- prefix l : session ---
bind -T prefix_l d   kill-session
bind -T prefix_l l   choose-session
bind -T prefix_l R   command-prompt -p "Rename to:"  "rename-session '%%'"
bind -T prefix_l s   command-prompt -p "New session name:" "if-shell -F '#{==:%1,}' new-session 'new-session -s \"%1\"'"
bind -T prefix_l Tab switch-client -l

# --- prefix q : quit ---
bind -T prefix_q q detach-client
bind -T prefix_q Q kill-server

# --- prefix w : window / pane ---
bind -T prefix_w [   resize-pane -L 5 \; switch-client -T prefix_w
bind -T prefix_w ]   resize-pane -R 5 \; switch-client -T prefix_w
bind -T prefix_w '{' resize-pane -U 5 \; switch-client -T prefix_w
bind -T prefix_w '}' resize-pane -D 5 \; switch-client -T prefix_w
bind -T prefix_w =   select-layout tiled
bind -T prefix_w d   kill-pane
bind -T prefix_w V   split-window -h -c "#{pane_current_path}"
bind -T prefix_w S   split-window -v -c "#{pane_current_path}"
bind -T prefix_w h   select-pane -L
bind -T prefix_w j   select-pane -D
bind -T prefix_w k   select-pane -U
bind -T prefix_w l   select-pane -R
bind -T prefix_w J   swap-pane -D
bind -T prefix_w K   swap-pane -U
bind -T prefix_w m   resize-pane -Z
bind -T prefix_w r   rotate-window
bind -T prefix_w R   rotate-window -D

# --- prefix G : window nav ---
bind -T prefix_G t next-window
bind -T prefix_G T previous-window

# --- prefix j : tmux-jump (incremental narrow + hints) ---
bind -T prefix_j j run-shell -b "JUMP_COLOR_DIM='#{@jump-color-dim}' JUMP_COLOR_MATCH='#{@jump-color-match}' JUMP_COLOR_SELECTED='#{@jump-color-selected}' JUMP_COLOR_HINT='#{@jump-color-hint}' $TMUX_PLUGIN_MANAGER_PATH/tmux-jump/tmux-jump.sh"

# --- prefix C-x : move ---
bind -T prefix_CX t   switch-client -T prefix_CX_t
bind -T prefix_CX_t r command-prompt -p "Move tab to:"  "move-window -t '%%'"

# TPM itself isn't listed as a @plugin — it's loaded directly by the `run`
# line below and would otherwise try (and fail) to install itself.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'nitaicharan/tmux-jump#dev'

# tmux-jump colors — tuned for Carbonfox palette
set -g @jump-color-dim      'fg=#7b7c7e,dim'                  # non-matching text
set -g @jump-color-match    'fg=#fff380,bg=#0c0c0c,bold'      # matched text
set -g @jump-color-selected 'fg=#0c0c0c,bg=#ee5396,bold'      # currently-selected match
set -g @jump-color-hint     'fg=#0c0c0c,bg=#78a9ff,bold'      # hint-mode badges
# set -g @jump-auto-hint-delay 100                                # ms idle before hints auto-show

source-file "$TMUX_HOME/themes/carbonfox.tmux"

run "$TMUX_PLUGIN_MANAGER_PATH/tpm"

# tmux-jump's tmux-jump.tmux binds `prefix + j` (default @jump-key) on load.
# Re-apply our chord entry so `prefix + j + j` wins.
bind -T prefix j switch-client -T prefix_j
