#!/usr/bin/env bash

# TODO: install session plugin
# -------------------------------------

TMUX_PLUGIN_MANAGER_PATH="~/.local/share/tmux/plugins"
TMUX_HOME="~/.config/tmux"
MYTMUXRC="$TMUX_HOME/tmux.conf"

set -g default-terminal "$TERM"
set -as terminal-overrides \
    ',$TERM:\
     Ss=\\E[%p1%d q:\
     Se=\\E[2 q'

set-option -g default-command "${SHELL} -i"

set-option -g status-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 4096
set -g status-interval 2
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-option -g bell-action none
set-window-option -g monitor-activity off
set-window-option -g mode-keys vi
set -gq allow-passthrough on
set -g detach-on-destroy off
set -g mouse on
set -g extended-keys on
set -sa terminal-features 'xterm*:extkeys'

force_color_prompt=yes

# --- Copy-mode ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Escape send-keys -X clear-selection
bind -T copy-mode Escape send -X cancel
bind -T copy-mode-vi Escape send -X cancel

# `y` as vim-style operator: if a selection is active (visual mode), copy it;
# otherwise switch into an operator-pending chord table that handles text
# objects. tmux has no native operator-pending mode — this chord layer fakes
# it. Press Escape at any point to back out without copying.
bind -T copy-mode-vi y if-shell -F '#{selection_present}' \
    'send-keys -X copy-pipe' \
    'switch-client -T copy_vi_y'

# yy = yank current line (matches vim)
bind -T copy_vi_y y send-keys -X select-line \; send-keys -X copy-pipe

# y{i,a}{motion}: inner / around text objects
bind -T copy_vi_y i switch-client -T copy_vi_yi
bind -T copy_vi_yi w send-keys -X select-word \; send-keys -X copy-pipe

# v{i,a}{motion}: visual-select text objects (viw selects inner word)
bind -T copy-mode-vi i switch-client -T copy_vi_i
bind -T copy_vi_i w send-keys -X select-word

# --- Unbinds (remove tmux defaults) ---
unbind :
unbind Escape
unbind C-h
unbind C-j
unbind C-k
unbind C-l
unbind d

# --- Single-key (prefix + X) ---
bind Tab last-window
bind "'" run "$TMUX_PLUGIN_MANAGER_PATH/tmux-floax/scripts/floax.sh"
bind C-u  copy-mode

bind -T prefix : command-prompt
bind -T prefix ` command-prompt -p "Move buffer to:"  "select-pane -t '%%'"
bind -T prefix ? run "tmux new-window; tmux list-keys"

# Pane select 0-9
bind -T prefix 0 select-pane -t 0
bind -T prefix 1 select-pane -t 1
bind -T prefix 2 select-pane -t 2
bind -T prefix 3 select-pane -t 3
bind -T prefix 4 select-pane -t 4
bind -T prefix 5 select-pane -t 5
bind -T prefix 6 select-pane -t 6
bind -T prefix 7 select-pane -t 7
bind -T prefix 8 select-pane -t 8
bind -T prefix 9 select-pane -t 9

# --- Prefix menus (definitions live in scripts/) ---
MENUS="$TMUX_HOME/scripts"

bind -T prefix b   run-shell "$MENUS/buffer.sh"
bind -T prefix f   run-shell "$MENUS/config.sh"
bind -T prefix F   run-shell "$MENUS/heavy.sh"
bind -T prefix G   run-shell "$MENUS/navigation.sh"
bind -T prefix h   run-shell "$MENUS/help.sh"
bind -T prefix j   run-shell "$MENUS/jump.sh"
bind -T prefix l   run-shell "$MENUS/session.sh"
bind -T prefix q   run-shell "$MENUS/quit.sh"
bind -T prefix t   run-shell "$MENUS/window.sh"
bind -T prefix w   run-shell "$MENUS/pane.sh"
bind -T prefix C-x run-shell "$MENUS/move.sh"

# Open the top-level command menu as soon as the default prefix (C-b) is
# pressed. Each item forwards its key through the existing prefix table.
set -g prefix None
set -g prefix2 None
bind -n C-b run-shell "$MENUS/main.sh"

# TPM itself isn't listed as a @plugin — it's loaded directly by the `run`
# line below and would otherwise try (and fail) to install itself.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'nitaicharan/tmux-jump#dev'

source-file "$TMUX_HOME/themes/carbonfox.tmux"

run "$TMUX_PLUGIN_MANAGER_PATH/tpm"

# tmux-jump's tmux-jump.tmux binds `prefix + j` (default @jump-key) on load.
# Re-apply our menu after TPM so it wins.
bind -T prefix j run-shell "$MENUS/jump.sh"
